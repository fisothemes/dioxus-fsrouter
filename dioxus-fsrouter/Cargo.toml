[package]
name = "dioxus-fsrouter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Component-based router for Dioxus with compile-time safety"
keywords = ["dioxus", "router", "web", "ui", "framework"]
categories = ["web-programming", "gui"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true }
dioxus-fsrouter-macro = { workspace = true }
linkme = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "History", "PopStateEvent"] }
wasm-bindgen = "0.2"

[dev-dependencies]
dioxus = { workspace = true }
