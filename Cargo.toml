[workspace]
resolver = "3"
members = [
    "packages/dioxus-fsrouter",
    "packages/dioxus-fsrouter-macro",
    "packages/dioxus-fsrouter-test",
]

[workspace.package]
edition = "2024"
authors = ["Goodwill Mzumala <fisothemes@egmail.com>"]
license = "MIT"
repository = "https://github.com/fisothemes/dioxus-fsrouter"

[workspace.dependencies]
dioxus = { version = "0.7", features = [] }
dioxus-fsrouter = { path = "packages/dioxus-fsrouter" }
dioxus-fsrouter-macro = { path = "packages/dioxus-fsrouter-macro" }
