[package]
name = "dioxus-fsrouter"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Easy to use component-based router for Dioxus with compile-time safety"
keywords = ["dioxus", "router", "web", "ui", "framework"]
categories = ["web-programming", "gui"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true }
dioxus-fsrouter-macro = { workspace = true }
inventory = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "History", "PopStateEvent"] }
wasm-bindgen = "0.2"
